[package]
name = "nsh-auth"
description = "OAuth and social sign-in core for Native Shell Rust apps: providers, PKCE, token exchange and refresh, sessions as signals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nsh-core = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
# rand 0.8: rsa 0.9 signs and verifies against rand_core 0.6, which 0.9 dropped.
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
