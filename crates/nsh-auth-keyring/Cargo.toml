[package]
name = "nsh-auth-keyring"
description = "OS-keyring session storage for nsh-auth desktop apps: one credential per session field behind the same SessionStore trait"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nsh-auth = { path = "../nsh-auth" }
keyring-core = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# No default features: the keychain module is the one this store wants; the
# protected-data module needs provisioning profiles an unsigned host lacks.
apple-native-keyring-store = { version = "1.0", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = "1.0"
