[package]
name = "host-desktop"
description = "Desktop launcher for nsh-auth: system browser + 127.0.0.1 loopback callback (examples/host-desktop)."
version = "0.1.0"
edition = "2024"
publish = false

# Own workspace root, like `nsh init --template rust` generates: the repo's
# root workspace (crates/nsh-auth) must not pull the example into its lockfile.
[workspace]

[features]
default = ["keyring"]
# The OS credential store behind --store keyring, the default on macOS and
# Windows; `--no-default-features` builds the JSON-store-only binary.
keyring = ["dep:nsh-auth-keyring"]

[dependencies]
env_logger = "0.11"
log = "0.4"
nsh-auth = { path = "../../crates/nsh-auth" }
nsh-auth-keyring = { path = "../../crates/nsh-auth-keyring", optional = true }
# The sibling HTTP client over the platform fetch; assumed checkout
# ~/fo/nsh-http (see README). Read-only for this build.
nsh-http = { path = "../../../nsh-http/crates/nsh-http" }
nsh-base = "0.4.0"
nsh-core = "0.4.0"
serde_json = "1"
# The Send receipt the adapter awaits while the engine executor runs the
# client future; oneshot needs no tokio runtime.
tokio = { version = "1", default-features = false, features = ["sync"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }

[dev-dependencies]
nsh-engine = { version = "0.4.0", default-features = false }
# `live`: UreqNetwork, the real network stack behind the platform fetch in
# the flow tests (loopback hosts only).
nsh-testing = { version = "0.4.0", default-features = false, features = ["live"] }
